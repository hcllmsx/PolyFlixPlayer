import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

// ─────────────────────────────────────────────────────────────────────────────
// 本目录是 media_kit_libs_android_video 1.3.8 的本地 vendor 副本（third_party）。
// 相对上游只改了两处，都标了【本仓库补丁】：
//   1. libmpv jar 版本 v1.1.7 -> v1.1.11，并同步 MD5；
//   2. 下载前先复用 _temp/prebuilt/media_kit_android/<版本>/ 里的预置 jar，实现离线构建。
// 升级上游时请把这两处改动一并带上。
// ─────────────────────────────────────────────────────────────────────────────

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // ── 离线优先：先把仓库预置的 jar 拷进缓存目录 ──────────────────────────
        // 本仓库把 libmpv 的 Android jar 预置在 _temp/prebuilt/media_kit_android/<版本>/。
        // 这里在下载之前先拷进来；只要 MD5 对得上，下面的循环就不会访问 GitHub，
        // 于是国内直连 GitHub 失败时 Android 构建照样能完成（本地缺失才回退下载）。
        // 注意：这个任务是在**配置阶段**执行的（本文件没有 doFirst/doLast），
        // 所以拷贝必须发生在下面 filesToDownload 校验之前，放在这里正是为了这个。
        def localVersion = "v1.1.11"
        def localPrebuiltDir = file("$rootDir/../_temp/prebuilt/media_kit_android/${localVersion}")
        def localCacheDir = file("$buildDir/${localVersion}")
        if (localPrebuiltDir.exists()) {
            localPrebuiltDir.eachFile { jar ->
                if (jar.isFile()) {
                    def target = new File(localCacheDir, jar.name)
                    if (!target.exists() || target.length() != jar.length()) {
                        localCacheDir.mkdirs()
                        target.bytes = jar.bytes
                        println "Using local prebuilt: ${jar.name}"
                    }
                }
            }
        }

        // Download all *.jar dependencies & verify their MD5 checksums.
        // 【本仓库补丁】上游用 v1.1.7，这里升到 v1.1.11（MD5 为对应版本的官方值）。
        def filesToDownload = [
            ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/default-arm64-v8a.jar", "md5": "540af35cefe192b42fafb253f8ca6580", "destination": file("$buildDir/v1.1.11/default-arm64-v8a.jar")],
            ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/default-armeabi-v7a.jar", "md5": "348ddcebec228bb53256ac980ea2bb84", "destination": file("$buildDir/v1.1.11/default-armeabi-v7a.jar")],
            ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/default-x86_64.jar", "md5": "d8d0b19a8bb673ab61f2808b2b9bf4fa", "destination": file("$buildDir/v1.1.11/default-x86_64.jar")],
            ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/default-x86.jar", "md5": "19906a87efffbe994a0ca976ab577feb", "destination": file("$buildDir/v1.1.11/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != fileInfo.md5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)